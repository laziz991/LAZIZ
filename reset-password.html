<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#183b2b">
  <title>Reset Password | LAZIZ</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f2f5f2;color:#183b2b;font-family:Arial,Helvetica,sans-serif}
    .card{width:100%;max-width:440px;background:#fff;padding:30px;border-radius:18px;box-shadow:0 12px 40px #183b2b14}
    .brand{font-size:27px;font-weight:850;letter-spacing:-1px;margin-bottom:8px}
    .brand span{color:#c99d48}
    h1{font-size:25px;margin:18px 0 8px}
    .muted{color:#66736b;line-height:1.55;font-size:14px}
    .field{margin:18px 0}
    .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    .field input{width:100%;padding:13px;border:1px solid #d8e0da;border-radius:9px;font-size:16px;outline:none}
    .field input:focus{border-color:#286044;box-shadow:0 0 0 3px #28604418}
    .btn{width:100%;border:0;border-radius:9px;background:#183b2b;color:#fff;font-size:15px;font-weight:700;padding:14px;cursor:pointer}
    .btn:disabled{opacity:.6;cursor:wait}
    .notice{display:none;margin:15px 0;padding:12px;border-radius:9px;background:#edf4ef;color:#244b35;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
    .notice.error{background:#fff0ed;color:#9b3024}
    .back{display:block;text-align:center;margin-top:20px;color:#286044;font-size:14px;text-decoration:none}
    .hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">LAZIZ<span>.</span></div>
    <h1>Set a new password</h1>
    <p class="muted">Choose a new password for your LAZIZ account. Enter it twice to confirm.</p>
    <div id="message" class="notice"></div>

    <form id="reset-form" class="hidden">
      <div class="field">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters">
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter the password again">
      </div>
      <button id="submit-button" class="btn" type="submit">Save new password</button>
    </form>

    <a class="back" href="./">Back to LAZIZ sign in</a>
  </main>

  <script src="./supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async function(){
      const message=document.getElementById('message');
      const form=document.getElementById('reset-form');
      const button=document.getElementById('submit-button');

      function showMessage(text,isError){
        message.textContent=text;
        message.style.display='block';
        message.classList.toggle('error',!!isError);
      }

      const cfg=window.LAZIZ_SUPABASE_CONFIG;
      if(!cfg?.url||!cfg?.publishableKey||!window.supabase?.createClient){
        showMessage('LAZIZ could not load its secure password service. Please refresh and try again.',true);
        return;
      }

      const sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true,
          storageKey:'laziz-auth-v1'
        }
      });

      let recoveryReady=false;

      async function checkRecoverySession(){
        try{
          const {data,error}=await sb.auth.getSession();
          if(error)throw error;
          if(data.session){
            recoveryReady=true;
            form.classList.remove('hidden');
            message.style.display='none';
            return true;
          }
          return false;
        }catch(error){
          console.error(error);
          return false;
        }
      }

      sb.auth.onAuthStateChange((event,session)=>{
        if(event==='PASSWORD_RECOVERY'&&session){
          recoveryReady=true;
          form.classList.remove('hidden');
          message.style.display='none';
        }
      });

      if(!(await checkRecoverySession())){
        showMessage('This password reset link is invalid, expired, or has already been used. Please return to LAZIZ and request a new password reset email.',true);
      }

      form.addEventListener('submit',async function(event){
        event.preventDefault();

        if(!recoveryReady){
          showMessage('Your reset session is not active. Please request a new reset link.',true);
          return;
        }

        const password=document.getElementById('password').value;
        const confirm=document.getElementById('confirm').value;

        if(password.length<8){
          showMessage('Your new password must contain at least 8 characters.',true);
          return;
        }

        if(password!==confirm){
          showMessage('The two passwords do not match. Please check them.',true);
          return;
        }

        button.disabled=true;
        button.textContent='SAVING…';

        try{
          const {error}=await sb.auth.updateUser({password});
          if(error)throw error;

          await sb.auth.signOut();
          form.classList.add('hidden');

          showMessage('Your password has been changed successfully. You can now return to LAZIZ and sign in with your email and new password.',false);

          const link=document.querySelector('.back');
          link.textContent='Go to LAZIZ sign in';
        }catch(error){
          console.error(error);
          showMessage(error.message||'We could not save your new password. Please request a fresh reset link and try again.',true);
          button.disabled=false;
          button.textContent='Save new password';
        }
      });
    })();
  </script>
</body>
</html>
